<!-- Backtotop start -->
<!-- เดิมเป็น <div> จึง tab ไปไม่ถึงและ screen reader ไม่รู้ว่าเป็นปุ่ม
     <button> ยิง event click เองเมื่อกด Enter/Space ตัวจัดการคลิกเดิม
     ใน main.js ที่ผูกกับ .backtotop-wrap จึงยังทำงานเหมือนเดิม -->
<button type="button" class="backtotop-wrap cursor-pointer"
        aria-label="กลับขึ้นด้านบน" data-i18n-attr="aria-label:aria.backtotop">
  <svg
    class="backtotop-circle svg-content"
    width="100%"
    height="100%"
    viewBox="-1 -1 102 102"
    aria-hidden="true"
  >
    <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
  </svg>
</button>
<!-- Backtotop end -->
